  <text x="342" y="226" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800">1,284</text>
  <text x="342" y="250" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">+14.2% this month</text>

  <rect x="586" y="156" width="248" height="114" rx="20" fill="#1B1B22" stroke="rgba(255,255,255,0.1)" />
  <text x="610" y="186" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em">TODAY CHECK-INS</text>
  <text x="610" y="226" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800">318</text>
  <text x="610" y="250" fill="#FF7366" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Peak hour 6PM–9PM</text>

  <rect x="854" y="156" width="250" height="114" rx="20" fill="#1B1B22" stroke="rgba(255,255,255,0.1)" />
  <text x="878" y="186" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em">TRAINER SESSIONS</text>
  <text x="878" y="226" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800">42</text>
  <text x="878" y="250" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">12 coaches active</text>

  <!-- Attendance Chart Panel -->
  <rect x="318" y="294" width="516" height="300" rx="22" fill="#1B1B22" stroke="rgba(255,255,255,0.1)" />
  <text x="344" y="330" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Weekly Floor Occupancy</text>
  <text x="344" y="349" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500">Real-time MySQL check-in records</text>

  <path d="M350 530 C410 475, 455 490, 505 435 C555 380, 600 415, 650 390 C705 362, 745 410, 800 355 L800 555 L350 555 Z" fill="url(#chartGrad)" />
  <path d="M350 530 C410 475, 455 490, 505 435 C555 380, 600 415, 650 390 C705 362, 745 410, 800 355" stroke="#FF5A47" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="505" cy="435" r="6" fill="#FFFFFF" stroke="#FF5A47" stroke-width="3" />
  <circle cx="650" cy="390" r="6" fill="#FFFFFF" stroke="#FF5A47" stroke-width="3" />
  <circle cx="800" cy="355" r="6" fill="#FFFFFF" stroke="#FF5A47" stroke-width="3" />

