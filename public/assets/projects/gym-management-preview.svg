  <rect x="854" y="294" width="250" height="300" rx="22" fill="#1B1B22" stroke="rgba(255,255,255,0.1)" />
  <text x="878" y="330" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Upcoming Sessions</text>

  <rect x="876" y="352" width="206" height="62" rx="14" fill="#23232D" />
  <rect x="890" y="366" width="8" height="34" rx="4" fill="#FF5A47" />
  <text x="910" y="381" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">HIIT Conditioning</text>
  <text x="910" y="400" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="11">05:30 PM · Studio A</text>

  <rect x="876" y="428" width="206" height="62" rx="14" fill="#23232D" />
  <rect x="890" y="442" width="8" height="34" rx="4" fill="#34D399" />
  <text x="910" y="457" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Strength &amp; Mobility</text>
  <text x="910" y="476" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="11">07:00 PM · Main Floor</text>

  <rect x="876" y="504" width="206" height="62" rx="14" fill="#23232D" />
  <rect x="890" y="518" width="8" height="34" rx="4" fill="#FBBF24" />
  <text x="910" y="533" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Nutrition Check-in</text>
  <text x="910" y="552" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="11">08:15 PM · Lounge</text>
