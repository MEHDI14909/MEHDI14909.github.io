<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="gymBg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111116" />
      <stop offset="55%" stop-color="#1B1014" />
      <stop offset="100%" stop-color="#0B0B0E" />
    </linearGradient>
    <radialGradient id="gymGlow" cx="78%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#E11D24" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#A2090F" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B0B0E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5A47" />
      <stop offset="100%" stop-color="#A2090F" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5A47" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FF5A47" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#gymBg)" />
  <rect width="1200" height="675" fill="url(#gymGlow)" />

  <!-- Subtle architectural grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 135H1200 M0 270H1200 M0 405H1200 M0 540H1200" />
    <path d="M200 0V675 M400 0V675 M600 0V675 M800 0V675 M1000 0V675" />
  </g>

  <!-- Main Dashboard Frame -->
  <rect x="64" y="48" width="1072" height="579" rx="28" fill="#14141A" fill-opacity="0.94" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

  <!-- Left Sidebar -->
  <rect x="64" y="48" width="218" height="579" rx="28" fill="#0F0F14" />
  <rect x="281" y="48" width="1" height="579" fill="rgba(255,255,255,0.08)" />

  <!-- Brand Mark -->
  <rect x="92" y="84" width="40" height="40" rx="12" fill="url(#accentRed)" />
  <path d="M103 104H121M106 97V111M118 97V111" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
  <text x="144" y="102" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="0.02em">IRONPULSE</text>
  <text x="144" y="120" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.14em">GYM ADMIN</text>

  <!-- Sidebar Menu Items -->
  <rect x="86" y="158" width="174" height="42" rx="12" fill="url(#accentRed)" fill-opacity="0.18" stroke="#FF5A47" stroke-opacity="0.45" />
  <circle cx="108" cy="179" r="5" fill="#FF5A47" />
  <text x="124" y="184" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Overview</text>

  <g fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">
    <circle cx="108" cy="232" r="4" fill="#4B5563" />
    <text x="124" y="237">Memberships</text>
    <circle cx="108" cy="280" r="4" fill="#4B5563" />
    <text x="124" y="285">Attendance</text>
    <circle cx="108" cy="328" r="4" fill="#4B5563" />
    <text x="124" y="333">Trainers &amp; Classes</text>
    <circle cx="108" cy="376" r="4" fill="#4B5563" />
    <text x="124" y="381">Billing &amp; Plans</text>
  </g>

  <!-- Laravel + MySQL Pill inside sidebar -->
  <rect x="86" y="520" width="174" height="74" rx="16" fill="#181820" stroke="rgba(255,255,255,0.1)" />
  <text x="102" y="546" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.14em">CORE ENGINE</text>
  <text x="102" y="569" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">PHP · Laravel</text>
  <text x="102" y="584" fill="#FF7366" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">MySQL Database</text>

