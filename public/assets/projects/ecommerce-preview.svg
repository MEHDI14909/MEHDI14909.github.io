  <polygon points="678,421 710,481 646,481" fill="#FFFFFF" fill-opacity="0.9" />
  <text x="588" y="538" fill="#111113" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800">Urban Hoodie</text>
  <text x="588" y="562" fill="#71717A" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Apparel · $88</text>
