  <text x="838" y="502" fill="#52525B" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Total</text>
  <text x="1074" y="502" text-anchor="end" fill="#111113" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="900">$248.00</text>

