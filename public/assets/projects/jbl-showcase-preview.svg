<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="jblBg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0B0E" />
      <stop offset="55%" stop-color="#220A0E" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <radialGradient id="jblCrimsonGlow" cx="62%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#E11D24" stop-opacity="0.52" />
      <stop offset="55%" stop-color="#A2090F" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jblShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E2E36" />
      <stop offset="55%" stop-color="#19191E" />
      <stop offset="100%" stop-color="#0E0E12" />
    </linearGradient>
    <linearGradient id="jblCrimsonPad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4747" />
      <stop offset="100%" stop-color="#990B12" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#jblBg)" />
  <rect width="1200" height="675" fill="url(#jblCrimsonGlow)" />

  <!-- Subtle Acoustic Sound Rings -->
  <circle cx="744" cy="340" r="240" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <circle cx="744" cy="340" r="185" stroke="rgba(225,29,36,0.22)" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="744" cy="340" r="130" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Giant Watermark Typography -->
  <text x="744" y="410" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.06" font-family="Inter, system-ui, sans-serif" font-size="250" font-weight="900" letter-spacing="-0.04em">JBL</text>

  <!-- Top Minimal Navbar -->
  <text x="80" y="84" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="0.08em">JBL</text>
  <circle cx="136" cy="77" r="4" fill="#E11D24" />
  <g fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">
    <text x="830" y="83">Home</text>
    <text x="900" y="83">About</text>
    <text x="970" y="83">Favorites</text>
    <text x="1062" y="83">Models</text>
  </g>

  <!-- Left Editorial Specs & CTA -->
  <text x="80" y="190" fill="#FF6B73" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.22em">PURE BASS WIRELESS</text>
  <text x="80" y="256" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="900">JBL LIVE</text>
  <text x="80" y="316" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="900">STUDIO PRO</text>

  <text x="80" y="366" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500">Signature wireless acoustics, 40mm dynamic drivers,</text>
  <text x="80" y="390" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500">50-hour battery life, and adaptive noise cancellation.</text>

  <!-- Feature Pills -->
  <rect x="80" y="428" width="126" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)" />
  <text x="143" y="452" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Bluetooth 5.3</text>

  <rect x="218" y="428" width="114" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)" />
  <text x="275" y="452" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">50H Battery</text>

  <!-- Primary CTA Button -->
  <rect x="80" y="496" width="188" height="48" rx="24" fill="url(#jblCrimsonPad)" />
  <text x="174" y="525" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="800">Buy Now · $149</text>

  <!-- Color Swatches Bottom -->
  <text x="80" y="592" fill="#71717A" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.16em">EDITIONS</text>
  <circle cx="174" cy="588" r="10" fill="#18181B" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="204" cy="588" r="10" fill="#E11D24" />
  <circle cx="234" cy="588" r="10" fill="#E4E4E7" />
  <circle cx="264" cy="588" r="10" fill="#2DD4BF" />

  <!-- Sleek Vector Studio Headphones Artwork (Right Center) -->
  <!-- Headband Arch -->
  <path d="M584 352 C584 196, 904 196, 904 352" stroke="url(#jblShell)" stroke-width="34" stroke-linecap="round" />
  <path d="M598 332 C614 218, 874 218, 890 332" stroke="rgba(255,255,255,0.16)" stroke-width="4" stroke-linecap="round" />

  <!-- Top Crimson Cushion Trim -->
  <path d="M674 226 C714 209, 774 209, 814 226" stroke="#E11D24" stroke-width="8" stroke-linecap="round" />

  <!-- Left Earcup & Cushion -->
  <rect x="546" y="330" width="76" height="158" rx="38" fill="url(#jblCrimsonPad)" />
  <rect x="526" y="344" width="66" height="130" rx="33" fill="url(#jblShell)" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- Right Earcup & Cushion -->
  <rect x="866" y="330" width="76" height="158" rx="38" fill="url(#jblCrimsonPad)" />
  <rect x="896" y="344" width="66" height="130" rx="33" fill="url(#jblShell)" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- Outer Studio Medallion on Right Cup -->
  <circle cx="929" cy="409" r="24" fill="#111115" stroke="#E11D24" stroke-width="2" />
  <text x="929" y="414" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="900">JBL</text>

  <!-- Interactive Hotspot Callouts (matching jbl-website tooltips) -->
  <circle cx="888" cy="240" r="8" fill="#E11D24" stroke="#FFFFFF" stroke-width="2.5" />
  <rect x="912" y="218" width="170" height="44" rx="12" fill="rgba(24,24,29,0.9)" stroke="rgba(255,255,255,0.16)" />
  <text x="930" y="238" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700">Memory Foam</text>
  <text x="930" y="253" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="10">Ergonomic Headband</text>

  <circle cx="540" cy="442" r="8" fill="#E11D24" stroke="#FFFFFF" stroke-width="2.5" />
  <rect x="412" y="492" width="166" height="44" rx="12" fill="rgba(24,24,29,0.9)" stroke="rgba(255,255,255,0.16)" />
  <text x="430" y="512" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700">Fast Charge</text>
  <text x="430" y="527" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="10">USB-C Audio &amp; Power</text>
</svg>
